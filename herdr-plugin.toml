# herdr-pane-resurrect: bring back the programs that were running in your panes.
#
# herdr restores a session's layout, each pane's cwd and (with [session] resume_agents_on_restore)
# the agent conversations, but the panes themselves come back as empty shells: whatever was running
# in them is gone. This plugin records those commands and replays them into the restored panes,
# which is the half tmux-resurrect covers that herdr does not.

id = "unstable-code.herdr-pane-resurrect"
name = "herdr-pane-resurrect"
version = "0.1.0"
description = "Save the commands running in your panes and replay them into the panes herdr restores."
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Save is safe to run at any time; restore starts processes, so it stays manual on purpose.
[[actions]]
id = "save"
title = "Save pane commands"
contexts = ["pane", "workspace"]
command = ["bin/save"]

[[actions]]
id = "restore"
title = "Restore pane commands"
contexts = ["pane", "workspace"]
command = ["bin/restore"]

# A snapshot is only useful if it exists when the session dies, and a session dies without warning:
# logging out of a graphical session terminates the whole process tree, so there is no shutdown hook
# to save from. The daemon keeps the snapshot current instead. --spawn returns immediately so the
# startup hook does not hold one of herdr's plugin command slots for the whole session.
[[startup]]
command = ["bin/autosave", "--spawn"]
